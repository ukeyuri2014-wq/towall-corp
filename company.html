<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#10243f">
  <title>会社情報 | 株式会社トワール</title>
  <style>
    :root {
      --navy-900: #10243f;
      --copper: #b78654;
      --ink: #172332;
      --text: #344252;
      --muted: #6a7785;
      --line: #dce2e8;
      --paper: #faf9f6;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--text); font-family: var(--sans); line-height: 1.9; -webkit-font-smoothing: antialiased; }
    header { background: var(--navy-900); color: #fff; padding: 44px 24px 40px; }
    .wrap { max-width: 760px; margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; color: #d7b58f; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 28px; letter-spacing: .08em; }
    main { padding: 40px 24px 64px; }
    h2 { margin: 0 0 18px; color: var(--ink); font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: .06em; }
    h2::after { content: ""; display: block; width: 44px; height: 2px; margin-top: 12px; background: var(--copper); }
    dl { margin: 0 0 44px; border-top: 1px solid var(--line); }
    .row { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 18px 4px; border-bottom: 1px solid var(--line); }
    dt { color: var(--muted); font-size: 14px; }
    dd { margin: 0; color: var(--ink); font-size: 15px; }
    .address-image { display: block; max-width: 100%; height: auto; }
    .note { margin: 0; color: var(--muted); font-size: 13px; }
    footer { padding: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 600px) {
      h1 { font-size: 23px; }
      .row { grid-template-columns: 1fr; gap: 4px; padding: 14px 2px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p class="eyebrow">Company information</p>
      <h1>株式会社トワール　会社情報</h1>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h2>会社概要</h2>
      <dl>
        <div class="row"><dt>商号</dt><dd>株式会社トワール<br>TOWALL Co., Ltd.</dd></div>
        <div class="row"><dt>代表者</dt><dd>代表取締役　嶺田 善弘</dd></div>
        <div class="row"><dt>法人番号</dt><dd>3120001286342</dd></div>
        <div class="row"><dt>本店所在地</dt><dd><img class="address-image" src="address.png" alt="本店所在地" width="648" height="112"></dd></div>
        <div class="row"><dt>事業内容</dt><dd>ホームページ制作（就労支援事業所さま向け）<br>EC物販事業</dd></div>
      </dl>

      <h2>ホームページ制作のご案内について</h2>
      <dl>
        <div class="row"><dt>ご案内の送信者</dt><dd>株式会社トワール　代表　嶺田 善弘</dd></div>
        <div class="row"><dt>お問い合わせ先</dt><dd>towall.partner@gmail.com</dd></div>
        <div class="row"><dt>ご案内の停止</dt><dd>ご案内メールに「不要」とご返信ください。以後のご連絡を停止いたします。</dd></div>
      </dl>
      <p class="note">お電話での営業は行っておりません。</p>
    </div>
  </main>
  <footer>© 株式会社トワール</footer>
</body>
</html>
